name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: namratha-25
          outputs: |
            dist/github-snake.svg?color_snake=%23DB91B3&color_dots=%23FFF7FA,%23F8DCE8,%23E8AFC3,%23D8B4E2,%23C8759B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23E8AFC3

      - name: Publish Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
